<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MNDWRX</title>
  <meta name="description" content="MNDWRX — Logic + Creativity. Two frequencies. One callsign." />
  <meta property="og:title" content="MNDWRX" />
  <meta property="og:description" content="Logic + Creativity = MNDWRX" />
  <meta property="og:image" content="https://mndwrx.github.io/assets/banner.jpg" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --ink: #f3f3f3;
      --muted: #9a9a9a;
      --lime: #c8ff3d;
      --magenta: #ff3cb8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    /* Banner kept near native aspect so cover doesn't shred the art */
    .hero {
      position: relative;
      width: 100%;
      /* 1760/576 ≈ 3.055 — a touch taller for presence, still not full-viewport crop hell */
      aspect-ratio: 2.7 / 1;
      min-height: clamp(220px, 38vw, 520px);
      max-height: 62vh;
      background: #000;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
      display: block;
      /* Punch clarity without mud */
      filter: contrast(1.08) saturate(1.12) brightness(1.04);
      /* Feather only the outer rim into page black — light touch */
      -webkit-mask-image: radial-gradient(120% 95% at 50% 45%, #000 52%, transparent 88%);
      mask-image: radial-gradient(120% 95% at 50% 45%, #000 52%, transparent 88%);
    }

    /* Tiny bottom fade only — type lives under the art, not under a muddy veil */
    .hero::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 28%;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 0%, #000 100%);
    }

    .copy {
      flex: 1;
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(28px, 5vh, 56px) 0 clamp(48px, 8vh, 80px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: clamp(2.1rem, 6vw, 3.6rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.035em;
      margin-bottom: 14px;
    }
    h1 .lime { color: var(--lime); }
    h1 .mag { color: var(--magenta); }
    h1 .dim { color: rgba(255,255,255,.38); font-weight: 500; }

    .lede {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 28ch;
      margin-bottom: 28px;
    }

    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: .06em;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.14);
      padding: 11px 16px;
      background: transparent;
      transition: border-color .15s ease, background .15s ease;
    }
    a.primary {
      background: var(--lime);
      color: #000;
      border-color: var(--lime);
      font-weight: 500;
    }
    a.primary:hover { filter: brightness(1.05); }
    a.ghost:hover { border-color: rgba(255,255,255,.4); }

    .soon {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,.08);
      max-width: 34ch;
    }
    .soon-label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(200,255,61,.7);
      margin-bottom: 8px;
    }
    .soon-line {
      font-size: .95rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .foot {
      margin-top: 36px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      color: rgba(255,255,255,.28);
    }

    @media (max-width: 700px) {
      .hero {
        aspect-ratio: 1.7 / 1;
        max-height: none;
        min-height: 200px;
      }
      .hero img { object-position: 58% 42%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero" aria-label="MNDWRX banner">
      <img src="assets/banner.jpg" alt="MNDWRX — split brain and wordmark" width="2800" height="916" />
    </section>

    <div class="copy">
      <h1>
        <span class="lime">Logic</span><span class="dim"> + </span><span class="mag">Creativity</span><span class="dim"> = </span>MNDWRX
      </h1>
      <p class="lede">Two frequencies. One callsign.</p>
      <div class="row">
        <a class="primary" href="https://x.com/MNDWRX">@MNDWRX</a>
        <a class="ghost" href="https://github.com/mndwrx">GitHub</a>
      </div>

      <section class="soon" aria-label="Coming soon">
        <p class="soon-label">Coming soon</p>
        <p class="soon-line">More signal on the way. Stay on the frequency.</p>
      </section>

      <p class="foot">It's just how it works…</p>
    </div>
  </div>
</body>
</html>
