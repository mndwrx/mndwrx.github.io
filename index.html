<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MNDWRX</title>
  <meta name="description" content="MNDWRX — Logic + Creativity. Built the mark. One voice. Not a company." />
  <meta property="og:title" content="MNDWRX" />
  <meta property="og:description" content="Logic + Creativity = MNDWRX" />
  <meta property="og:image" content="https://mndwrx.github.io/assets/mark-glitch.png" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --ink: #f2f2f2;
      --muted: #7a7a7a;
      --lime: #c8ff3d;
      --magenta: #ff3cb8;
      --gap: 2px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Full-width triptych — no cards, no glow, no radius */
    .triptych {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: var(--gap);
      width: 100%;
      background: #111;
      border-bottom: 1px solid #151515;
    }
    .panel {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(260px, 48vh, 560px);
      overflow: hidden;
    }
    .panel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #000;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(36px, 6vw, 72px) clamp(20px, 4vw, 48px) 48px;
      max-width: 920px;
      margin: 0 auto;
      width: 100%;
    }

    .kicker {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(2rem, 5.5vw, 3.4rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.035em;
      margin-bottom: 14px;
    }
    h1 .lime { color: var(--lime); }
    h1 .mag { color: var(--magenta); }
    h1 .dim { color: #555; font-weight: 500; }

    .lede {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 28ch;
      margin-bottom: 28px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    a {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: .06em;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid #2a2a2a;
      padding: 11px 16px;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    a.primary {
      background: var(--lime);
      color: #000;
      border-color: var(--lime);
      font-weight: 500;
    }
    a.primary:hover { filter: brightness(1.04); }
    a.ghost:hover { border-color: #666; }

    .foot {
      margin-top: auto;
      padding-top: 40px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      color: #444;
    }

    @media (max-width: 900px) {
      .triptych { grid-template-columns: 1fr; }
      .panel { min-height: clamp(220px, 38vh, 420px); }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="triptych" aria-label="MNDWRX marks">
      <div class="panel">
        <img src="assets/mark-glitch.png" alt="MNDWRX wordmark" width="1600" height="900" />
      </div>
      <div class="panel">
        <img src="assets/mark-brain.jpg" alt="MNDWRX split brain" width="1000" height="1000" />
      </div>
      <div class="panel">
        <img src="assets/mark-3d.jpg" alt="MNDWRX dimensional mark" width="1000" height="1000" />
      </div>
    </section>

    <div class="body">
      <p class="kicker">MNDWRX</p>
      <h1>
        <span class="lime">Logic</span>
        <span class="dim"> + </span>
        <span class="mag">Creativity</span>
        <span class="dim"> = </span>
        MNDWRX
      </h1>
      <p class="lede">Built the mark. One voice. Not a company.</p>
      <div class="row">
        <a class="primary" href="https://x.com/MNDWRX">@MNDWRX</a>
        <a class="ghost" href="https://github.com/mndwrx">GitHub</a>
      </div>
      <p class="foot">It's just how it works…</p>
    </div>
  </div>
</body>
</html>
