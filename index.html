<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MNDWRX — Logic + Creativity</title>
  <meta name="description" content="MNDWRX — Logic + Creativity. Built the mark. One voice. Not a company." />
  <meta property="og:title" content="MNDWRX" />
  <meta property="og:description" content="Logic + Creativity = MNDWRX" />
  <meta property="og:image" content="https://mndwrx.github.io/assets/mark-glitch.png" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --ink: #f4f4f4;
      --muted: #8e8e8e;
      --lime: #b8ff3c;
      --magenta: #ff3cb8;
      --line: rgba(255,255,255,.08);
      --card: #0c0c0c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      background:
        radial-gradient(900px 520px at 8% -8%, rgba(184,255,60,.10), transparent 55%),
        radial-gradient(820px 480px at 100% 0%, rgba(255,60,184,.11), transparent 52%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px 72px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .top a { color: var(--muted); text-decoration: none; }
    .top a:hover { color: var(--ink); }

    /* Three marks, one stage */
    .stage {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 14px;
      margin-bottom: 36px;
    }
    .frame {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.02) inset,
        0 24px 60px rgba(0,0,0,.55);
    }
    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.35));
      opacity: .55;
    }
    .hero {
      aspect-ratio: 16 / 10;
      min-height: 280px;
    }
    .stack {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
    }
    .tile { min-height: 0; }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.01);
      transition: transform .55s ease, filter .55s ease;
      filter: saturate(1.05) contrast(1.04);
    }
    .frame:hover img { transform: scale(1.035); filter: saturate(1.12) contrast(1.06); }

    .glow-lime { box-shadow: 0 0 40px rgba(184,255,60,.08), 0 24px 60px rgba(0,0,0,.55); }
    .glow-mag { box-shadow: 0 0 40px rgba(255,60,184,.09), 0 24px 60px rgba(0,0,0,.55); }

    .copy { max-width: 34rem; }
    .eq {
      font-size: clamp(1.85rem, 5vw, 3rem);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }
    .eq .lime { color: var(--lime); }
    .eq .mag { color: var(--magenta); }
    .eq .plus { color: var(--muted); font-weight: 500; }
    .lede {
      font-size: 1.08rem;
      color: var(--muted);
      max-width: 36ch;
      margin-bottom: 26px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: .78rem;
    }
    .tags span {
      border: 1px solid var(--line);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.02);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    a.btn {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-weight: 700;
      font-size: .95rem;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    a.primary { background: var(--lime); color: #050505; }
    a.primary:hover { filter: brightness(1.05); }
    a.ghost { border-color: var(--line); color: var(--ink); }
    a.ghost:hover { border-color: #444; }
    footer {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: .72rem;
      color: var(--muted);
    }
    @media (max-width: 820px) {
      .stage { grid-template-columns: 1fr; }
      .stack { grid-template-columns: 1fr 1fr; grid-template-rows: none; }
      .hero { aspect-ratio: 16 / 11; }
      .tile { aspect-ratio: 1 / 1; }
    }
    @media (max-width: 520px) {
      .stack { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <span>MNDWRX</span>
      <a href="https://github.com/mndwrx">github.com/mndwrx</a>
    </div>

    <section class="stage" aria-label="MNDWRX marks">
      <figure class="frame hero glow-lime">
        <img src="assets/mark-glitch.png" alt="MNDWRX glitch wordmark" width="1600" height="1000" />
      </figure>
      <div class="stack">
        <figure class="frame tile glow-mag">
          <img src="assets/mark-brain.jpg" alt="MNDWRX split-brain mark" width="800" height="800" />
        </figure>
        <figure class="frame tile glow-lime">
          <img src="assets/mark-3d.jpg" alt="MNDWRX dimensional mark" width="800" height="800" />
        </figure>
      </div>
    </section>

    <section class="copy">
      <h1 class="eq">
        <span class="lime">Logic</span>
        <span class="plus">+</span>
        <span class="mag">Creativity</span>
        <span class="plus">=</span>
        MNDWRX
      </h1>
      <p class="lede">Built the mark. One voice. Not a company.</p>
      <div class="tags">
        <span>split</span>
        <span>ship</span>
        <span>craft</span>
        <span>mark</span>
      </div>
      <div class="actions">
        <a class="btn primary" href="https://x.com/MNDWRX">X · @MNDWRX</a>
        <a class="btn ghost" href="https://github.com/mndwrx">GitHub</a>
      </div>
    </section>

    <footer>It's just how it works…</footer>
  </main>
</body>
</html>
